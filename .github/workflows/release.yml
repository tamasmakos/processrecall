name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

# A release run must never be cancelled mid-upload, and it must not share
# ci.yml's group.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    # By reference, never copied: one gate definition means a release can never
    # be checked more loosely than a merge to main.
    uses: ./.github/workflows/ci.yml
    # Pinned by tests/test_release_workflow.py and tests/test_repo_hygiene.py;
    # narrowing this to named secrets is tracked separately.
    secrets: inherit # zizmor: ignore[secrets-inherit] 2026-08-27

  stack:
    # The one proof nothing else here gives: that deploy/Dockerfile actually
    # builds and the stack it starts actually answers a query. `publish`
    # depends on this job, so a broken image or a failing acceptance.sh fails
    # the release before any asset is attached (FR-004, SC-003).
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # deploy/compose.yaml runs the app with GRAPHKNOWS_ENV=production, where
      # the settings refuse to boot on the default password (FR-005). Compose
      # interpolates this into both the arcadedb root password and the app's
      # credentials, so the stack under test is the production shape, not a
      # relaxed one. A throwaway value: the stack lives for one job.
      GRAPHKNOWS_ARCADEDB_PASSWORD: release-stack-check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: download the distribution CI built
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist/

      - name: place the wheel where deploy/Dockerfile expects it
        # The compose build context is the repo root (deploy/compose.yaml
        # `context: ..`), and the Dockerfile COPYs the wheel by its exact
        # filename, not a glob.
        run: cp dist/*.whl .

      - name: build the release image
        run: docker compose -f deploy/compose.yaml build

      - name: bring up the stack
        # --wait honours arcadedb's healthcheck, so a database that never
        # becomes ready fails here with a named service instead of timing out
        # inside acceptance.sh.
        run: docker compose -f deploy/compose.yaml up -d --wait

      - name: run the acceptance script
        run: sh deploy/acceptance.sh

      - name: tear down the stack
        if: always()
        run: docker compose -f deploy/compose.yaml down -v

  publish:
    needs: [ci, stack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Scoped here alone: attaching a release asset writes to this repository.
      # Nothing is published to a public index, so no OIDC identity is needed
      # and no API token is stored anywhere.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # `gh` authenticates from GH_TOKEN at the step that needs it, so a
          # credential persisted on disk buys nothing.
          persist-credentials: false

      - name: assert the tag matches the packaged version
        # Read the literal out of the source text. Importing the package would
        # pull torch/gliner/spacy into a lean publish job and raise ImportError
        # instead of checking a version. The version is never typed into this
        # file: automation reads it, it does not restate it.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          packaged=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' graphknows/_version.py)
          if [ -z "$packaged" ]; then
            echo "::error::no __version__ literal found in graphknows/_version.py"
            exit 1
          fi
          if [ "$tag" != "$packaged" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} carries version ${tag}, graphknows/_version.py says ${packaged}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches packaged version ${packaged}"

      - name: download the distribution CI built
        # The same bytes the py.typed and wheel-size assertions ran against.
        # This job performs no build of its own.
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: dist
          path: dist/

      - name: assemble the deployment bundle
        # The layout mirrors the repository -- deploy/ and scripts/ at the
        # archive root beside the wheel -- so deploy/Dockerfile builds
        # identically from an unpacked bundle or from a checkout, and the
        # recipient never needs access to this repository.
        #
        # The scripts are copied in here rather than committed under deploy/:
        # two files that must stay byte-identical are a sync problem, and there
        # is nothing to keep in sync if only one copy exists.
        run: |
          set -eu
          bundle="graphknows-deploy-${GITHUB_REF_NAME#v}"
          mkdir -p "${bundle}/deploy" "${bundle}/scripts"
          cp deploy/Dockerfile deploy/compose.yaml deploy/acceptance.sh "${bundle}/deploy/"
          cp scripts/bake_models.py scripts/preflight.py scripts/docker-entrypoint.sh "${bundle}/scripts/"
          cp dist/*.whl "${bundle}/"
          tar -czf "${bundle}.tar.gz" "${bundle}"
          echo "BUNDLE=${bundle}.tar.gz" >> "$GITHUB_ENV"

      - name: generate a software bill of materials
        # Scans dist/, which at this point holds the wheel and sdist actually
        # being released, not the working tree — this is what a recipient
        # with no repository access can check their download against.
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist
          format: spdx-json
          output-file: dist/graphknows-sbom.spdx.json
          # Attached to the release explicitly below, alongside the wheel and
          # the bundle, instead of relying on this action's own release
          # detection — the trigger here is a tag push, not a `release` event.
          upload-artifact: false
          upload-release-assets: false

      - name: record provenance for the release assets
        # A self-attested provenance record — sha256 digests of the release
        # assets bound to the commit, workflow run and tag that produced
        # them — not a Sigstore-signed attestation: this workflow carries no
        # OIDC signing permission (test_publishes_wheel_as_private_release_asset
        # pins that none reappears now that FR-007 removed the package-index trusted
        # Publisher that used to need one).
        run: |
          set -eu
          python3 - dist/*.whl "$BUNDLE" dist/graphknows-sbom.spdx.json <<'PY'
          import hashlib
          import json
          import os
          import sys

          def sha256(path: str) -> str:
              digest = hashlib.sha256()
              with open(path, "rb") as handle:
                  for chunk in iter(lambda: handle.read(65536), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          provenance = {
              "builder": f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              "sourceCommit": os.environ["GITHUB_SHA"],
              "sourceRef": os.environ["GITHUB_REF_NAME"],
              "subjects": [{"name": os.path.basename(p), "sha256": sha256(p)} for p in sys.argv[1:]],
          }
          with open("dist/graphknows-provenance.json", "w") as handle:
              json.dump(provenance, handle, indent=2)
          PY

      - name: attach the wheel, bundle, SBOM and provenance record to the release
        # This repository is private, so its Release IS the private channel.
        # Nothing here reaches a public package index.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1             || gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.whl "$BUNDLE" \
            dist/graphknows-sbom.spdx.json dist/graphknows-provenance.json --clobber
